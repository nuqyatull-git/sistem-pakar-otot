<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistem Pakar Diagnosa Otot{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .navbar-brand { font-weight: 600; }
        .card { border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

        @media print {
        .no-print { display: none !important; }
        .card { box-shadow: none !important; border: 1px solid #ccc !important; }
    }
    </style>
</head>
<body>

   
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">Sistem Pakar Otot</a>
        <div class="d-flex align-items-center">
            {% if request.user.is_authenticated %}
                <span class="text-white me-3">Halo, {{ request.user.pasien.nama }}</span>
                <a href="{% url 'diagnosa' %}" class="btn btn-outline-light btn-sm me-2 no-print">Diagnosa</a>
                <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm no-print">Logout</a>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm me-2 no-print">Masuk</a>
                <a href="{% url 'register' %}" class="btn btn-light btn-sm no-print">Daftar akun</a>
            {% endif %}
        </div>
    </div>
</nav>
    

    <div class="container py-5">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

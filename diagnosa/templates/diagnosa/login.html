{% extends 'base.html' %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4">
            <h3 class="text-center mb-4"> Login Pasien</h3>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Nama</label>
                    {{ form.nama }}
                </div>
                <div class="mb-3">
                    <label class="form-label">No Kartu Pasien</label>
                    {{ form.no_kartu }}
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
                <a href="{% url 'home' %}" class="btn btn-outline-secondary w-100 mt-2">Beranda</a>
            </form>
            <p class="text-center mt-3 mb-0">Belum punya akun? <a href="{% url 'register' %}">Daftar di sini</a></p>
        </div>
    </div>
</div>
{% endblock %}
